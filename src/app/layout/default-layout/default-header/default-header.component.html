<c-container [fluid]="true" class="header-container px-4">
  <div class="header-shell">
    <div class="header-actions">
      <c-header-nav class="header-bell-nav" *ngIf="isAdminUser()">
        <app-notification-bell></app-notification-bell>
      </c-header-nav>

      <c-header-nav class="header-user-nav">
        <c-dropdown [popperOptions]="{ placement: 'bottom-end' }" variant="nav-item">
          <button [caret]="false" cDropdownToggle class="user-menu-trigger" aria-label="Open user menu">
            <span class="user-avatar-fallback">
              {{ (authService.userName() || 'U').charAt(0).toUpperCase() }}
            </span>
            <span class="user-name">{{ authService.userName() || 'User' }}</span>
          </button>
          <ul cDropdownMenu class="pt-0 user-menu-dropdown">
            <li><h6 cDropdownHeader class="user-menu-header">Account</h6></li>
            <li><a cDropdownItem (click)="logout()">Logout</a></li>
          </ul>
        </c-dropdown>
      </c-header-nav>
    </div>
  </div>
</c-container>
