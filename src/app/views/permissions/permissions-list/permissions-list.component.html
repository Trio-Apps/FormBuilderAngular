<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="fields-page-container">
  <!-- Top Navigation Bar (same style as Forms Manage) -->
  <div class="top-navbar">
    <div class="nav-content">
      <div class="nav-left">
        <button class="nav-back-btn" routerLink="/dashboard" title="Back to Dashboard">
          <i class="pi pi-arrow-left"></i>
        </button>
        <div class="nav-title-section">
          <h1 class="page-title">Permissions</h1>
          <p class="page-subtitle">Manage all permissions defined in the system</p>
        </div>
      </div>
      <div class="nav-right">
        <button
          class="btn-icon"
          (click)="loadPermissions()"
          [disabled]="loading"
          title="Refresh"
        >
          <i class="pi pi-refresh"></i>
        </button>
        <button
          class="btn-primary"
          (click)="openNew()"
          [disabled]="loading"
        >
          <i class="pi pi-plus"></i>
          <span>New Permission</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb-section">
    <nav class="breadcrumb-nav">
      <a routerLink="/dashboard" class="breadcrumb-link">
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>
      <i class="pi pi-angle-right breadcrumb-separator"></i>
      <span class="breadcrumb-current">
        <i class="pi pi-shield"></i>
        <span>Permissions</span>
      </span>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <app-table-shell title="Permissions List" icon="pi pi-table">
      <div table-actions>
        <div class="search-box">
          <i class="pi pi-search"></i>
          <input
            type="text"
            placeholder="Search permissions..."
            class="search-input"
            [(ngModel)]="searchTerm"
          />
        </div>
        <div class="results-count">
          {{ filteredPermissions.length }} permissions
        </div>
      </div>

      <div class="table-wrapper">
        <p-table
          [value]="filteredPermissions"
          [loading]="loading"
          styleClass="p-datatable-sm forms-table"
          [paginator]="true"
          [rows]="10"
          [rowsPerPageOptions]="[10, 20, 50]"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>Name</th>
              <th>Screen</th>
              <th>Description</th>
              <th>Status</th>
              <th class="text-end actions-column">Actions</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-row>
            <tr>
              <td class="mono">{{ row.name }}</td>
              <td>{{ row.screenName }}</td>
              <td>{{ row.description }}</td>
              <td>
                <span
                  class="status-pill"
                  [ngClass]="row.isActive ? 'active' : 'inactive'"
                >
                  {{ row.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td class="actions-cell text-end">
                <button
                  pButton
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-text"
                  (click)="openEdit(row)"
                ></button>
                <button
                  pButton
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-text p-button-danger"
                  (click)="confirmDelete(row)"
                ></button>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="5" class="empty-message">
                No permissions found
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </app-table-shell>
  </div>
</div>

<p-dialog
    [(visible)]="showDialog"
    [modal]="true"
    [style]="{ width: '460px' }"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [header]="isEdit ? 'Edit Permission' : 'New Permission'"
  >
    <div class="p-fluid">
      <div class="field">
        <label for="name">Name</label>
        <input
          id="name"
          pInputText
          [(ngModel)]="current.name"
          placeholder="FormTab_Allow_View"
        />
      </div>

      <div class="field">
        <label for="screenName">Screen</label>
        <input
          id="screenName"
          pInputText
          [(ngModel)]="current.screenName"
          placeholder="FormTab"
        />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <input
          id="description"
          pInputText
          [(ngModel)]="current.description"
          placeholder="Short description"
        />
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select
          id="status"
          [(ngModel)]="current.isActive"
          class="p-inputtext p-component"
        >
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <button
        pButton
        label="Cancel"
        class="p-button-text"
        (click)="showDialog = false"
      ></button>
      <button
        pButton
        label="Save"
        (click)="save()"
      ></button>
    </ng-template>
  </p-dialog>
</div>
