<div class="container-fluid">
  <!-- Welcome Message -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
      <p class="text-muted">Welcome back, {{userName}}!</p>
    </div>
   
  </div>

  <!-- Stats Cards -->
  <div class="row">
    <div class="col-xl-3 col-md-6 mb-4" *ngFor="let stat of stats">
      <div class="card border-left-{{stat.color}} shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-{{stat.color}} text-uppercase mb-1">
                {{ stat.title }}
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">{{ stat.value }}</div>
            </div>
            <div class="col-auto">
              <i [class]="stat.icon + ' fa-2x text-gray-300'"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="row">
    <div class="col-lg-12">
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h5 class="card-title mb-0">Welcome to Form Builder</h5>
        </div>
        <div class="card-body">
          <p>Start creating and managing your forms from the sidebar navigation.</p>
          <div class="row mt-4">
            <div class="col-md-3 mb-3">
              <a routerLink="/forms" class="btn btn-primary w-100">
                <i class="fas fa-plus me-2"></i> Create Form
              </a>
            </div>
            <div class="col-md-3 mb-3">
              <a routerLink="/tabs" class="btn btn-success w-100">
                <i class="fas fa-layer-group me-2"></i> Manage Tabs
              </a>
            </div>
            <div class="col-md-3 mb-3">
              <a routerLink="/fields" class="btn btn-info w-100">
                <i class="fas fa-list me-2"></i> Add Fields
              </a>
            </div>
            <div class="col-md-3 mb-3">
              <a routerLink="/submissions" class="btn btn-warning w-100">
                <i class="fas fa-file-alt me-2"></i> View Submissions
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
