<div class="dash">
  <!-- Header -->
  <div class="dash-header">
    <h1 class="dash-title">Dashboard</h1>
    <p class="dash-subtitle">Welcome back, {{ userName }}!</p>
  </div>

  <!-- Stats -->
  <div class="dash-stats">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-icon"><i [class]="stat.icon"></i></div>
      <div class="stat-body">
        <div class="stat-label">{{ stat.title }}</div>
        <div class="stat-value">{{ stat.value }}</div>
      </div>
    </div>
  </div>

  <!-- Welcome / quick actions -->
  <div class="dash-panel">
    <div class="dash-panel-head">
      <h2>Welcome to Form Builder</h2>
      <p>Start creating and managing your forms from the sidebar navigation.</p>
    </div>
    <div class="dash-actions">
      <a routerLink="/forms" class="dash-action">
        <i class="pi pi-plus"></i><span>Create Form</span>
      </a>
      <a routerLink="/tabs" class="dash-action">
        <i class="pi pi-clone"></i><span>Manage Tabs</span>
      </a>
      <a routerLink="/fields" class="dash-action">
        <i class="pi pi-list"></i><span>Add Fields</span>
      </a>
      <a routerLink="/submissions" class="dash-action dash-action--ghost">
        <i class="pi pi-file"></i><span>View Submissions</span>
      </a>
    </div>
  </div>
</div>
